<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adaa Avenue - Fast Bill Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-900 font-sans min-h-screen">

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyPdi0V0tY8ofiEC8Y_0uk_wjNu2xhIPBiwGZ3LlkclnEJtvWddv6eF9bafEZZdzTpn/exec";
  </script>

  <!-- Header -->
  <header class="bg-[#1B365D] text-white shadow-md sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2.5">
        <i class="fa-solid fa-store text-amber-300 text-lg"></i>
        <h1 class="text-base font-bold tracking-wide">ADAA AVENUE</h1>
      </div>
      <button onclick="fetchPortalData(true)" class="text-xs bg-indigo-900/80 hover:bg-indigo-900 border border-indigo-700/60 px-3 py-1.5 rounded-lg text-slate-200 flex items-center gap-1.5 transition">
        <i class="fa-solid fa-arrows-rotate"></i> Refresh Data
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 sm:p-6 space-y-4">

    <!-- Step 1: Bill Dropdown Selector -->
    <div class="bg-white p-4 sm:p-5 rounded-xl shadow-sm border border-slate-200">
      <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
        <i class="fa-solid fa-receipt mr-1 text-[#1B365D]"></i> Select Purchase Bill:
      </label>
      <select id="billSelector" onchange="onBillSelected()" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-lg text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-[#1B365D] focus:outline-none">
        <option value="">Loading bills...</option>
      </select>
    </div>

    <!-- Step 2: Line Items Table -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
        <div>
          <h2 id="activeBillHeader" class="text-sm font-bold text-slate-800">Bill Items</h2>
          <p id="activeBillSubtext" class="text-xs text-slate-500">Pick a bill above to view available stock</p>
        </div>
        <span id="itemsCountBadge" class="hidden text-xs bg-indigo-100 text-indigo-900 font-bold px-2 py-0.5 rounded">0 items</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-100 text-slate-700 text-xs uppercase font-semibold">
            <tr>
              <th class="p-3">Product Code</th>
              <th class="p-3 text-right">Purchase Cost</th>
              <th class="p-3 text-right">Selling MRP</th>
              <th class="p-3 text-center">Available Stock</th>
              <th class="p-3 text-center">Action</th>
            </tr>
          </thead>
          <tbody id="itemsTableBody" class="divide-y divide-slate-200 text-slate-700">
            <tr><td colspan="4" class="text-center p-6 text-slate-400">Loading live data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Quick Sale Modal Prompt -->
  <div id="saleModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-5 space-y-4 animate-in fade-in zoom-in duration-150">
      <div class="flex justify-between items-start border-b border-slate-100 pb-3">
        <div>
          <span class="text-[10px] font-bold text-indigo-700 uppercase">Log Sale (1 Piece)</span>
          <h3 id="modalSkuTitle" class="text-base font-extrabold text-slate-900">SKU</h3>
        </div>
        <button onclick="closeSaleModal()" class="text-slate-400 hover:text-slate-600 text-lg">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form onsubmit="submitSale(event)" class="space-y-3">
        <input type="hidden" id="modalSku">
        
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Sold By (Reseller / Channel):</label>
          <select id="modalReseller" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-slate-50 font-medium">
            <option value="Direct Retail">Direct Retail Walk-in</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Actual Sold Price (₹):</label>
          <input type="number" id="modalPrice" required min="1" class="w-full p-2.5 border border-slate-300 rounded-lg text-base font-bold text-[#1B365D] focus:ring-2 focus:ring-[#1B365D]">
          <span id="modalDefaultMrpHint" class="text-[11px] text-slate-400 mt-1 block">Default MRP: ₹0</span>
        </div>

        <div class="pt-2 flex gap-2">
          <button type="button" onclick="closeSaleModal()" class="w-1/3 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-lg text-xs transition">
            Cancel
          </button>
          <button type="submit" id="btnConfirmSale" class="w-2/3 py-2.5 bg-[#1B365D] hover:bg-slate-800 text-white font-bold rounded-lg text-xs shadow transition">
            Confirm Sale
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let portalData = { bills: [], resellers: [] };

    async function fetchPortalData(force = false) {
      const selector = document.getElementById("billSelector");
      const tbody = document.getElementById("itemsTableBody");
      selector.innerHTML = `<option value="">Loading purchase bills...</option>`;
      tbody.innerHTML = `<tr><td colspan="4" class="text-center p-6 text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Loading live stock...</td></tr>`;

      try {
        const res = await fetch(`${API_URL}?action=getPortalView`);
        const json = await res.json();

        if (json.status === "success") {
          portalData = json;
          populateBillDropdown(json.bills);
          populateResellerDropdown(json.resellers);
        } else {
          throw new Error(json.message || "Failed to load data");
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center p-4 text-rose-600 font-semibold">Error: ${err.message}. <button onclick="fetchPortalData(true)" class="underline ml-2 text-indigo-700 font-bold">Retry</button></td></tr>`;
      }
    }

    function populateBillDropdown(bills) {
      const selector = document.getElementById("billSelector");
      selector.innerHTML = "";

      if (!bills || bills.length === 0) {
        selector.innerHTML = `<option value="">No bills found. Run syncPortalStockView() in your maintenance script.</option>`;
        return;
      }

      bills.forEach((b) => {
        const opt = document.createElement("option");
        opt.value = b.billRef;
        // Ensures billRef is prefixed if not already included in the label
        opt.innerText = b.label.startsWith(b.billRef) ? b.label : `${b.billRef} — ${b.label}`;
        selector.appendChild(opt);
      });

      onBillSelected();
    }

    function populateResellerDropdown(resellers) {
      const resSelect = document.getElementById("modalReseller");
      resSelect.innerHTML = `<option value="Direct Retail">Direct Retail Walk-in</option>`;
      (resellers || []).forEach(r => {
        const opt = document.createElement("option");
        opt.value = r;
        opt.innerText = r;
        resSelect.appendChild(opt);
      });
    }

    function onBillSelected() {
      const selectedRef = document.getElementById("billSelector")?.value;
      const tbody = document.getElementById("itemsTableBody");
      const header = document.getElementById("activeBillHeader");
      const subtext = document.getElementById("activeBillSubtext");
      const badge = document.getElementById("itemsCountBadge");

      if (!tbody) return;

      if (!portalData || !portalData.bills || portalData.bills.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center p-6 text-slate-400">No bills loaded.</td></tr>`;
        return;
      }

      // Safe lookup
      const bill = portalData.bills.find(b => String(b.billRef).trim() === String(selectedRef).trim());

      if (!bill) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center p-6 text-slate-400">Please select a valid bill from the dropdown.</td></tr>`;
        if (badge) badge.classList.add("hidden");
        return;
      }

      if (header) header.innerText = bill.label || "Selected Bill";
      if (subtext) subtext.innerText = `Bill Number: ${bill.billRef || 'N/A'}`;
      
      const itemsList = Array.isArray(bill.items) ? bill.items : [];

      if (badge) {
        badge.classList.remove("hidden");
        badge.innerText = `${itemsList.length} items`;
      }

      tbody.innerHTML = "";

      if (itemsList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center p-6 text-slate-400">No products registered under this bill.</td></tr>`;
        return;
      }

      // Safe iteration
      itemsList.forEach(item => {
        if (!item) return;

        const sku = item.sku || "UNKNOWN";
        const stock = Number(item.stock) || 0;
        const mrp = Number(item.mrp) || 0;
        const purchaseCost = Number(item.purchasePrice) || 0;
        const isOutOfStock = stock <= 0;

        // Build details line (Description • Color • Size)
        const details = [item.description, item.color, item.size].filter(Boolean).join(" • ");

        tbody.innerHTML += `
          <tr class="hover:bg-slate-50 transition">
            <td class="p-3">
              <span class="font-mono font-bold text-slate-900 text-sm block">${sku}</span>
              ${details ? `<span class="text-xs text-slate-500 block mt-0.5">${details}</span>` : ''}
            </td>
            <td class="p-3 text-right font-semibold text-slate-600">₹${purchaseCost.toLocaleString()}</td>
            <td class="p-3 text-right font-extrabold text-[#1B365D]">₹${mrp.toLocaleString()}</td>
            <td class="p-3 text-center">
              <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${stock > 3 ? 'bg-emerald-100 text-emerald-800' : (stock > 0 ? 'bg-amber-100 text-amber-800' : 'bg-rose-100 text-rose-800')}">
                ${stock} pcs
              </span>
            </td>
            <td class="p-3 text-center">
              <button onclick="openSaleModal('${sku}', ${mrp})" 
                      ${isOutOfStock ? 'disabled' : ''} 
                      class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1 mx-auto shadow-sm ${isOutOfStock ? 'bg-slate-200 text-slate-400 cursor-not-allowed' : 'bg-[#1B365D] hover:bg-slate-800 text-white'}">
                <i class="fa-solid fa-plus text-[10px]"></i> Add Sale
              </button>
            </td>
          </tr>
        `;
      });
    }

    function openSaleModal(sku, defaultMrp) {
      document.getElementById("modalSku").value = sku;
      document.getElementById("modalSkuTitle").innerText = `Log Sale: ${sku}`;
      document.getElementById("modalPrice").value = defaultMrp;
      document.getElementById("modalDefaultMrpHint").innerText = `Default Selling MRP: ₹${defaultMrp}`;
      document.getElementById("saleModal").classList.remove("hidden");
      document.getElementById("modalPrice").focus();
    }

    function closeSaleModal() {
      document.getElementById("saleModal").classList.add("hidden");
    }

    async function submitSale(e) {
      e.preventDefault();
      const sku = document.getElementById("modalSku").value;
      const price = document.getElementById("modalPrice").value;
      const reseller = document.getElementById("modalReseller").value;
      const btn = document.getElementById("btnConfirmSale");

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> Saving...`;

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            sku: sku,
            soldPrice: price,
            resellerName: reseller
          })
        });

        const res = await response.json();
        if (res.status === "success") {
          portalData.bills.forEach(b => {
            const found = b.items.find(i => i.sku === sku);
            if (found) found.stock = Math.max(0, found.stock - 1);
          });
          onBillSelected();
          closeSaleModal();
        } else {
          alert(`Error: ${res.message}`);
        }
      } catch (err) {
        alert(`Network Error: ${err.message}`);
      } finally {
        btn.disabled = false;
        btn.innerText = "Confirm Sale";
      }
    }

    window.onload = () => {
      fetchPortalData();
    };
  </script>
</body>
</html>
