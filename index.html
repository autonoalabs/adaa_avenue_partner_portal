<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adaa Boutique - Inventory & OMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .tab-btn.active { border-bottom: 3px solid #1B365D; color: #1B365D; font-weight: bold; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans min-h-screen">

  <script>
    // =========================================================================
    // CONFIGURATION: Paste your Web App URL here
    // =========================================================================
    const API_URL = "https://script.google.com/macros/s/AKfycbyPdi0V0tY8ofiEC8Y_0uk_wjNu2xhIPBiwGZ3LlkclnEJtvWddv6eF9bafEZZdzTpn/exec";
  </script>

  <!-- Navigation Bar -->
  <header class="bg-[#1B365D] text-white shadow-md sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-store text-xl text-amber-300"></i>
        <div>
          <h1 class="text-lg font-bold tracking-wide">ADAA BOUTIQUE</h1>
          <p class="text-[11px] text-slate-300">Live Inventory & Partner Portal</p>
        </div>
      </div>
      <button onclick="loadAllData()" class="bg-indigo-900 hover:bg-indigo-800 text-xs px-3 py-2 rounded-lg font-medium shadow flex items-center gap-1.5">
        <i class="fa-solid fa-arrows-rotate"></i> <span>Sync</span>
      </button>
    </div>
  </header>

  <!-- Sub Header Tabs -->
  <nav class="bg-white border-b border-slate-200 sticky top-[57px] z-30">
    <div class="max-w-6xl mx-auto px-4 flex space-x-6 text-sm">
      <button onclick="switchTab('inventory')" id="tab-inventory" class="tab-btn active py-3">Catalog & Stock</button>
      <button onclick="switchTab('resellers')" id="tab-resellers" class="tab-btn py-3 text-slate-500">Reseller Ledger</button>
      <button onclick="switchTab('actions')" id="tab-actions" class="tab-btn py-3 text-slate-500">Log Entry</button>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto p-4 sm:p-6">

    <!-- ============================================================= -->
    <!-- TAB 1: PRODUCT CATALOG & LIVE INVENTORY                       -->
    <!-- ============================================================= -->
    <section id="view-inventory">
      <!-- Search & Filters -->
      <div class="grid grid-cols-1 sm:grid-cols-12 gap-3 mb-6">
        <div class="sm:col-span-8 relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
          <input type="text" id="searchInput" onkeyup="filterItems()" placeholder="Search by SKU, fabric, design number, color..." 
                 class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-300 rounded-lg text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-[#1B365D]">
        </div>
        <div class="sm:col-span-4">
          <select id="statusFilter" onchange="filterItems()" class="w-full py-2.5 px-3 bg-white border border-slate-300 rounded-lg text-sm shadow-sm">
            <option value="ALL">All Stock Statuses</option>
            <option value="In Stock">In Stock Only</option>
            <option value="Low Stock">Low Stock (≤ 3)</option>
            <option value="Out of Stock">Out of Stock</option>
          </select>
        </div>
      </div>

      <!-- Loading State -->
      <div id="catalogLoading" class="text-center py-12">
        <i class="fa-solid fa-spinner fa-spin text-3xl text-indigo-900"></i>
        <p class="text-sm text-slate-500 mt-2">Loading live stock data...</p>
      </div>

      <!-- Inventory Grid -->
      <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5 hidden"></div>
    </section>

    <!-- ============================================================= -->
    <!-- TAB 2: RESELLER LEDGER & CREDIT BALANCES                      -->
    <!-- ============================================================= -->
    <section id="view-resellers" class="hidden">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="p-4 bg-slate-50 border-b border-slate-200">
          <h2 class="font-bold text-slate-800 text-sm">Reseller Consignment & Balance Statements</h2>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-slate-100 text-slate-700 text-xs uppercase font-semibold">
              <tr>
                <th class="p-3">Reseller</th>
                <th class="p-3 text-center">Holding</th>
                <th class="p-3 text-center">Sold</th>
                <th class="p-3 text-center">Returned</th>
                <th class="p-3 text-right">Total Billing</th>
                <th class="p-3 text-right">Received</th>
                <th class="p-3 text-right">Balance Due</th>
                <th class="p-3 text-center">Status</th>
              </tr>
            </thead>
            <tbody id="resellerTableBody" class="divide-y divide-slate-200 text-slate-700">
              <tr><td colspan="8" class="text-center p-6 text-slate-400">Loading reseller balances...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- ============================================================= -->
    <!-- TAB 3: LOG SALE / CONSIGNMENT / RETURN                         -->
    <!-- ============================================================= -->
    <section id="view-actions" class="hidden">
      <div class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <div class="flex gap-2 mb-6 border-b border-slate-200 pb-3">
          <button type="button" onclick="setActionForm('sale')" id="btn-form-sale" class="text-xs font-bold px-3 py-1.5 rounded-lg bg-[#1B365D] text-white">Record Sale</button>
          <button type="button" onclick="setActionForm('consignment')" id="btn-form-consignment" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-slate-100 text-slate-700">Issue Consignment</button>
          <button type="button" onclick="setActionForm('return')" id="btn-form-return" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-slate-100 text-slate-700">Record Return</button>
        </div>

        <form id="actionForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
          <input type="hidden" id="formActionType" value="recordSale">

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Product SKU *</label>
              <input type="text" id="inpSku" required placeholder="e.g. DRS-GEO-101-BLU-FS" class="w-full p-2.5 border rounded-lg text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Quantity *</label>
              <input type="number" id="inpQty" min="1" required value="1" class="w-full p-2.5 border rounded-lg text-sm">
            </div>
          </div>

          <div id="dynamicFields">
            <!-- Dynamically populated for Sale / Consignment / Return -->
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Notes / Remarks</label>
            <input type="text" id="inpNotes" placeholder="Optional reference or contact" class="w-full p-2.5 border rounded-lg text-sm">
          </div>

          <button type="submit" id="btnSubmitForm" class="w-full bg-[#1B365D] hover:bg-[#12243e] text-white font-bold py-3 rounded-lg text-sm shadow">
            Submit Record
          </button>
          <p id="formStatusMsg" class="text-center text-xs mt-2 font-semibold"></p>
        </form>
      </div>
    </section>

  </main>

  <!-- Core Dashboard JavaScript -->
  <script>
    let inventoryData = [];
    let resellerData = [];

    // Switch between the three top tabs
    function switchTab(tabId) {
      ['inventory', 'resellers', 'actions'].forEach(t => {
        document.getElementById(`view-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).classList.remove('active');
        document.getElementById(`tab-${t}`).classList.add('text-slate-500');
      });
      document.getElementById(`view-${tabId}`).classList.remove('hidden');
      document.getElementById(`tab-${tabId}`).classList.add('active');
      document.getElementById(`tab-${tabId}`).classList.remove('text-slate-500');
    }

    // Fetch data from Apps Script
    async function loadAllData() {
      document.getElementById("catalogLoading").classList.remove("hidden");
      document.getElementById("productGrid").classList.add("hidden");

      try {
        // Fetch inventory
        const resInv = await fetch(`${API_URL}?action=getInventory`);
        const jsonInv = await resInv.json();
        if (jsonInv.status === "success") {
          inventoryData = jsonInv.data;
          renderCatalog(inventoryData);
        }

        // Fetch reseller ledger
        const resLedg = await fetch(`${API_URL}?action=getResellerLedger`);
        const jsonLedg = await resLedg.json();
        if (jsonLedg.status === "success") {
          resellerData = jsonLedg.data;
          renderResellers(resellerData);
        }
      } catch (err) {
        document.getElementById("catalogLoading").innerHTML = 
          `<p class="text-red-500 text-sm font-semibold">Could not reach the database. Check that API_URL is correct and set to "Anyone".</p>`;
      }
    }

    // Render Product Cards
    function renderCatalog(items) {
      const grid = document.getElementById("productGrid");
      grid.innerHTML = "";
      document.getElementById("catalogLoading").classList.add("hidden");
      grid.classList.remove("hidden");

      if (!items || items.length === 0) {
        grid.innerHTML = `<p class="col-span-full text-center text-slate-400 py-8">No products found in the catalog.</p>`;
        return;
      }

      items.forEach(p => {
        const badgeColor = p.status === "In Stock" ? "bg-emerald-100 text-emerald-800" :
                           p.status === "Low Stock" ? "bg-amber-100 text-amber-800" : "bg-rose-100 text-rose-800";

        grid.innerHTML += `
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col justify-between">
            <div class="h-44 bg-slate-100 flex items-center justify-center overflow-hidden border-b border-slate-100">
              ${p.imageUrl && p.imageUrl.startsWith("http") 
                ? `<img src="${p.imageUrl}" alt="${p.name}" class="h-full w-full object-cover">` 
                : `<i class="fa-solid fa-shirt text-slate-300 text-4xl"></i>`}
            </div>
            <div class="p-4 flex-grow flex flex-col justify-between">
              <div>
                <div class="flex justify-between items-start gap-1 mb-1">
                  <span class="text-xs font-mono font-bold text-[#1B365D] bg-indigo-50 px-2 py-0.5 rounded">${p.sku}</span>
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded ${badgeColor}">${p.status}</span>
                </div>
                <h3 class="font-bold text-slate-800 text-sm mt-1 leading-snug">${p.name}</h3>
                <p class="text-xs text-slate-500 mt-0.5">${p.fabric} • ${p.color} • ${p.size}</p>
              </div>

              <div class="mt-4 pt-3 border-t border-slate-100 flex justify-between items-end">
                <div>
                  <span class="text-[11px] text-slate-400 block">Retail MRP</span>
                  <span class="text-base font-extrabold text-slate-900">₹${p.retailMrp}</span>
                </div>
                <div class="text-right">
                  <span class="text-[11px] text-slate-400 block">Rack Stock</span>
                  <span class="text-base font-bold ${p.liveRackStock > 0 ? 'text-[#1B365D]' : 'text-rose-600'}">${p.liveRackStock} pcs</span>
                </div>
              </div>
            </div>
          </div>
        `;
      });
    }

    // Filter Items by text or status
    function filterItems() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      const status = document.getElementById("statusFilter").value;

      const filtered = inventoryData.filter(item => {
        const matchesQuery = item.sku.toLowerCase().includes(q) ||
                             item.name.toLowerCase().includes(q) ||
                             item.fabric.toLowerCase().includes(q) ||
                             item.color.toLowerCase().includes(q);
        const matchesStatus = (status === "ALL") || (item.status === status);
        return matchesQuery && matchesStatus;
      });

      renderCatalog(filtered);
    }

    // Render Reseller Ledger Table
    function renderResellers(resellers) {
      const tbody = document.getElementById("resellerTableBody");
      tbody.innerHTML = "";
      if (!resellers || resellers.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center p-6 text-slate-400">No reseller entries found.</td></tr>`;
        return;
      }

      resellers.forEach(r => {
        const isClear = r.accountHealth === "Clear Account";
        tbody.innerHTML += `
          <tr class="hover:bg-slate-50">
            <td class="p-3 font-semibold text-slate-800">${r.resellerName} <span class="text-xs text-slate-400 block font-normal">${r.phone || ''}</span></td>
            <td class="p-3 text-center font-bold text-slate-700">${r.heldQty}</td>
            <td class="p-3 text-center text-slate-600">${r.soldQty}</td>
            <td class="p-3 text-center text-slate-600">${r.returnedQty}</td>
            <td class="p-3 text-right font-medium">₹${r.totalBilling}</td>
            <td class="p-3 text-right text-emerald-600 font-medium">₹${r.paymentsReceived}</td>
            <td class="p-3 text-right font-bold ${r.balanceDue > 0 ? 'text-rose-600' : 'text-slate-700'}">₹${r.balanceDue}</td>
            <td class="p-3 text-center"><span class="text-[11px] font-semibold px-2 py-0.5 rounded ${isClear ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${r.accountHealth}</span></td>
          </tr>
        `;
      });
    }

    // Set Form Fields for Action Type
    function setActionForm(type) {
      const container = document.getElementById("dynamicFields");
      const actionHidden = document.getElementById("formActionType");
      
      ['sale', 'consignment', 'return'].forEach(btn => {
        const b = document.getElementById(`btn-form-${btn}`);
        b.className = "text-xs font-semibold px-3 py-1.5 rounded-lg bg-slate-100 text-slate-700";
      });
      document.getElementById(`btn-form-${type}`).className = "text-xs font-bold px-3 py-1.5 rounded-lg bg-[#1B365D] text-white";

      if (type === 'sale') {
        actionHidden.value = "recordSale";
        container.innerHTML = `
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Sales Channel</label>
              <select id="inpChannel" class="w-full p-2.5 border rounded-lg text-sm">
                <option value="Direct Retail Walk-in">Direct Retail Walk-in</option>
                <option value="Reseller Sale">Reseller Sale</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Customer / Reseller Name</label>
              <input type="text" id="inpParty" placeholder="Name" required class="w-full p-2.5 border rounded-lg text-sm">
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Tag MRP (₹)</label>
              <input type="number" id="inpMrp" placeholder="1300" required class="w-full p-2.5 border rounded-lg text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Discount / pc (₹)</label>
              <input type="number" id="inpDiscount" value="0" class="w-full p-2.5 border rounded-lg text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Actual Sold Rate (₹)</label>
              <input type="number" id="inpActualRate" placeholder="1250" required class="w-full p-2.5 border rounded-lg text-sm">
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Payment Mode</label>
              <select id="inpPayMode" class="w-full p-2.5 border rounded-lg text-sm">
                <option value="UPI / GPay">UPI / GPay</option>
                <option value="Cash">Cash</option>
                <option value="Bank Transfer">Bank Transfer</option>
                <option value="Udhaar / Credit">Udhaar / Credit</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Payment Status</label>
              <select id="inpPayStatus" class="w-full p-2.5 border rounded-lg text-sm">
                <option value="Received">Received</option>
                <option value="Pending">Pending</option>
              </select>
            </div>
          </div>
        `;
      } else if (type === 'consignment') {
        actionHidden.value = "issueConsignment";
        container.innerHTML = `
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Reseller Name</label>
              <input type="text" id="inpParty" placeholder="e.g. Partner A" required class="w-full p-2.5 border rounded-lg text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Reseller Base Rate / pc (₹)</label>
              <input type="number" id="inpBaseRate" placeholder="e.g. 1150" required class="w-full p-2.5 border rounded-lg text-sm">
            </div>
          </div>
        `;
      } else if (type === 'return') {
        actionHidden.value = "recordReturn";
        container.innerHTML = `
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Return Direction</label>
              <select id="inpDirection" class="w-full p-2.5 border rounded-lg text-sm">
                <option value="Reseller Return to Shop">Reseller Return to Shop</option>
                <option value="Customer Return to Shop">Customer Return to Shop</option>
                <option value="Defective Sent to Wholesaler">Defective Sent to Wholesaler</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Party / Reseller Name</label>
              <input type="text" id="inpParty" placeholder="Name" required class="w-full p-2.5 border rounded-lg text-sm">
            </div>
          </div>
          <div class="mt-3">
            <label class="block text-xs font-semibold text-slate-600 mb-1">Reason for Return</label>
            <input type="text" id="inpReason" placeholder="Defective stitching, color exchange, etc." required class="w-full p-2.5 border rounded-lg text-sm">
          </div>
        `;
      }
    }

    // Handle Form Submission
    async function handleFormSubmit(e) {
      e.preventDefault();
      const statusMsg = document.getElementById("formStatusMsg");
      const btn = document.getElementById("btnSubmitForm");
      const actionType = document.getElementById("formActionType").value;

      btn.disabled = true;
      btn.innerText = "Submitting to Sheet...";
      statusMsg.innerText = "";

      let payload = {
        action: actionType,
        sku: document.getElementById("inpSku").value,
        qty: document.getElementById("inpQty").value,
        notes: document.getElementById("inpNotes").value
      };

      if (actionType === "recordSale") {
        payload.channel = document.getElementById("inpChannel").value;
        payload.customerOrReseller = document.getElementById("inpParty").value;
        payload.qtySold = document.getElementById("inpQty").value;
        payload.tagMrp = document.getElementById("inpMrp").value;
        payload.discountPerPc = document.getElementById("inpDiscount").value;
        payload.actualRatePerPc = document.getElementById("inpActualRate").value;
        payload.paymentMode = document.getElementById("inpPayMode").value;
        payload.paymentStatus = document.getElementById("inpPayStatus").value;
      } else if (actionType === "issueConsignment") {
        payload.resellerName = document.getElementById("inpParty").value;
        payload.qtyIssued = document.getElementById("inpQty").value;
        payload.resellerBaseRate = document.getElementById("inpBaseRate").value;
      } else if (actionType === "recordReturn") {
        payload.returnDirection = document.getElementById("inpDirection").value;
        payload.partyName = document.getElementById("inpParty").value;
        payload.returnQty = document.getElementById("inpQty").value;
        payload.reason = document.getElementById("inpReason").value;
      }

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const result = await response.json();

        if (result.status === "success") {
          statusMsg.className = "text-center text-xs mt-2 font-semibold text-emerald-600";
          statusMsg.innerText = "✓ " + result.message;
          document.getElementById("actionForm").reset();
          setActionForm('sale');
          loadAllData(); // Refresh stock immediately
        } else {
          statusMsg.className = "text-center text-xs mt-2 font-semibold text-rose-600";
          statusMsg.innerText = "Error: " + result.message;
        }
      } catch (err) {
        statusMsg.className = "text-center text-xs mt-2 font-semibold text-rose-600";
        statusMsg.innerText = "Connection failed. Please check network or script deployment.";
      } finally {
        btn.disabled = false;
        btn.innerText = "Submit Record";
      }
    }

    // Initialize Default View
    window.onload = () => {
      setActionForm('sale');
      loadAllData();
    };
  </script>
</body>
</html>
